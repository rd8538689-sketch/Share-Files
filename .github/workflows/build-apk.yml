name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect active Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VER) is lower than required version 17."
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Found expected debug APK at $EXPECTED_APK"
            echo "apk_path=$EXPECTED_APK" >> $GITHUB_OUTPUT
          else
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching app/build/outputs/apk directory:"
            find app/build/outputs/apk -name "*.apk" || echo "No APKs found"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_RELEASE_DIR"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME="app"
          fi
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9_-' '-' | sed 's/^-//;s/-$//')
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp -v "${{ steps.verify_apk.outputs.apk_path }}" "$RELEASE_ASSET_PATH"

          if [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "asset_path=$RELEASE_ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_FILENAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $RELEASE_ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          cat << 'EOF' > release_notes.md
          ### 📱 Automated Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run Number**: ${{ github.run_number }}
          - **Build Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: `${{ github.sha }}`
          - **Target Branch**: `${{ github.ref_name }}`
          - **Artifact Name**: `app-debug-apk`

          > **Note for testing**:
          > - This APK is intended for testing and direct download on Android devices.
          > - This is **not** a Play Store production release.
          > - This APK is signed with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=========================================="
            echo "🎉 GitHub Release Published Successfully!"
            echo "Tag: $RELEASE_TAG"
            echo "Title: Debug APK Build #${{ github.run_number }}"
            echo "Asset: $ASSET_NAME"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Direct Release URL: $RELEASE_URL"
            echo "=========================================="

            echo "### 🚀 APK Ready for Download!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Your Android debug APK was compiled and published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 **Direct Release Link**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- 📱 **Direct APK File**: \`$ASSET_NAME\` (available under the Assets section)" >> $GITHUB_STEP_SUMMARY
            echo "- 🛡️ **Backup Actions Artifact**: \`app-debug-apk\` is also available on the workflow run page." >> $GITHUB_STEP_SUMMARY
          else
            echo "=========================================="
            echo "⚠️ Release publishing encountered an issue or was skipped."
            echo "The APK build and Actions artifact upload succeeded."
            echo "Artifact name: app-debug-apk"
            echo "=========================================="

            echo "### ⚠️ Debug APK Build Succeeded (Release Notice)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK was built successfully and saved as a GitHub Actions workflow artifact." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 **Download Artifact**: Go to the workflow summary page and download the \`app-debug-apk\` zip archive containing \`app-debug.apk\`." >> $GITHUB_STEP_SUMMARY
            echo "- ℹ️ Note: If release creation failed due to repository permissions, ensure GitHub Actions has \`Read and write permissions\` in *Settings -> Actions -> General -> Workflow permissions*." >> $GITHUB_STEP_SUMMARY
          fi
